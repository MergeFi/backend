name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  # Also run on commits that land on main by any path (admin bypass,
  # misconfigured or not-yet-enabled branch protection), so the secret scan,
  # lint, build and tests still gate the default branch (#156).
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mergefi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # #833 — Pin actions to full commit SHAs for supply-chain security; a
      # tag like @v4 is a mutable pointer. Dependabot keeps these current.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the secret scan can inspect every commit, not
          # just the working tree — a credential committed and later removed
          # is invisible to a shallow checkout (#155).
          fetch-depth: 0

      # .nvmrc is the single source of truth for the Node major (#835), so
      # CI can't drift from what contributors and the Dockerfile run.
      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Scan for Hardcoded Secrets (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.28.0
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
          # release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Update both
          # together: the tarball is verified before it is extracted, so a
          # substituted release asset fails the job instead of running (#833).
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "Downloading gitleaks v${GITLEAKS_VERSION}..."
          curl -sSfL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "${tarball}" gitleaks
          rm -f "${tarball}"
          # `gitleaks git` walks the full commit history (not just the current
          # tree) using gitleaks' maintained rule set — AWS keys, generic
          # high-entropy tokens, connection strings, webhook URLs, JWTs, etc.
          # — replacing the three hand-rolled regexes this step used to run.
          ./gitleaks git . --redact --verbose --exit-code 1
        shell: bash

      - name: Install Dependencies
        run: npm ci

      # Fail on any high/critical advisory in the installed tree, matching
      # MergeFi/frontend (#829). Dependabot (.github/dependabot.yml) opens the
      # upgrade PRs; this is what makes an unpatched one visible on every PR.
      - name: Audit Dependencies
        run: npm audit --audit-level=high

      # Fail immediately when two migration files share the same timestamp
      # prefix: TypeORM uses the prefix as a primary key in the migrations
      # table, so duplicates cause one of the colliding files to be silently
      # skipped on `migration:run` (#734).
      - name: Check for duplicate migration timestamps
        run: |
          ! ls src/database/migrations | cut -d- -f1 | sort | uniq -d | grep .

      # `npm run lint` never passes --fix: auto-fixing in a throwaway checkout
      # let fixable violations pass while they stayed in the repo, and without
      # --max-warnings 0 warn-level findings never failed the build (#827).
      # Contributors use `npm run lint:fix` locally.
      - name: Lint Code
        run: npm run lint

      - name: Build Application
        run: npm run build

      # The migrations are the schema contract production runs on, but the
      # tests used to build their schema with `synchronize`, so nothing proved
      # the migration set applies (#830). Run it against the empty service
      # database, revert every migration (catches a missing or broken down()),
      # check that left nothing behind, then apply it again and check the
      # round trip reproduced the same schema. The e2e step below then runs
      # on this migrated schema.
      - name: Run, Revert and Re-run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mergefi
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          dump_schema() {
            pg_dump -h localhost -U postgres -d mergefi --schema-only \
              --no-owner --no-privileges \
              -T migrations -T migrations_id_seq | grep -v '^\\\|^--'
          }

          npm run migration:run
          dump_schema > /tmp/schema-first.sql

          count=$(ls src/database/migrations/*.ts | wc -l)
          for _ in $(seq "$count"); do
            npm run migration:revert
          done
          leftover=$(psql -h localhost -U postgres -d mergefi -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'migrations'")
          applied=$(psql -h localhost -U postgres -d mergefi -tAc "SELECT count(*) FROM migrations")
          if [ "$leftover" != "0" ] || [ "$applied" != "0" ]; then
            echo "::error::Reverting every migration left $leftover table(s) and $applied applied migration(s)"
            exit 1
          fi

          npm run migration:run
          dump_schema > /tmp/schema-second.sql
          diff -u /tmp/schema-first.sql /tmp/schema-second.sql
        shell: bash

      # A single instrumented run: a plain `npm run test` before it executed
      # the same suite twice for no extra signal (#828). The coverageThreshold
      # in package.json fails this step if coverage regresses.
      - name: Run Unit & Integration Tests (with coverage)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mergefi
          NODE_ENV: test
        run: npm run test:cov

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # The e2e specs run entirely against the local Postgres service and a
      # mocked Stellar SDK; none of them use GITHUB_CLIENT_ID/SECRET. The step
      # used to be gated on those (never-configured) secrets, so `npm run
      # test:e2e` had never actually executed in CI (#164). Run it always.
      # DATABASE_SYNCHRONIZE is unset, so AppModule uses the schema the
      # migration step built rather than deriving one from the entities (#830).
      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mergefi
          NODE_ENV: test
        run: npm run test:e2e
